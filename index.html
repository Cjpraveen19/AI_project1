<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>🍳 Leftover Chef</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            text-align: center;
            margin: 0;
            padding: 0;
        }

        h1 {
            color: #333;
            margin-top: 40px;
        }

        .container {
            margin-top: 50px;
        }

        input {
            padding: 12px;
            width: 300px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        button {
            padding: 12px 20px;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin-left: 8px;
        }

        button:hover {
            background: #ff5252;
        }

        .card {
            margin-top: 30px;
            padding: 20px;
            background: white;
            border-radius: 12px;
            width: 520px;
            max-width: 90%;
            margin-left: auto;
            margin-right: auto;
            text-align: left;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }

        .title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: Arial, sans-serif;
            line-height: 1.5;
        }
    </style>
</head>

<body>

<h1>🍳 Leftover Chef</h1>

<div class="container">
    <input id="ingredients" placeholder="egg,onion,tomato">
    <button onclick="getRecipe()">Get Recipe</button>
</div>

<div id="result"></div>

<script>
async function getRecipe() {
    const ingredients = document.getElementById("ingredients").value.trim();

    if (!ingredients) {
        alert("Please enter ingredients first!");
        return;
    }

    document.getElementById("result").innerHTML = "<p>Loading recipe...</p>";

    // For local backend
    const API_BASE = "http://127.0.0.1:8000";

    // For deployed Render backend, use this instead:
    // const API_BASE = "https://ai-project1-1iws.onrender.com";

    try {
        const res = await fetch(
            `${API_BASE}/recommend-text-simple?ingredients=${encodeURIComponent(ingredients)}`
        );

        const data = await res.text();

        if (!res.ok) {
            throw new Error(`Status ${res.status}: ${data}`);
        }

        document.getElementById("result").innerHTML = `
            <div class="card">
                <div class="title">🍽 Recommended Recipe</div>
                <pre>${data}</pre>
            </div>
        `;
    } catch (error) {
        document.getElementById("result").innerHTML = `
            <div class="card">
                <div class="title">❌ Error</div>
                <p>Could not fetch recipe.</p>
                <pre>${error.message}</pre>
            </div>
        `;
        console.error(error);
    }
}
</script>

</body>
</html>
