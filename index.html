<!DOCTYPE html>
<html>
<head>
    <title>🍳 Leftover Chef</title>
    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
            text-align: center;
        }

        h1 {
            color: #333;
        }

        .container {
            margin-top: 50px;
        }

        input {
            padding: 12px;
            width: 300px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        button {
            padding: 12px 20px;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .card {
            margin-top: 30px;
            padding: 20px;
            background: white;
            border-radius: 12px;
            width: 500px;
            margin-left: auto;
            margin-right: auto;
            text-align: left;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }

        .title {
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<h1>🍳 Leftover Chef</h1>

<div class="container">
    <input id="ingredients" placeholder="egg,onion,tomato">
    <br><br>
    <button onclick="getRecipe()">Get Recipe</button>
</div>

<div id="result"></div>

<script>
async function getRecipe() {
    const ingredients = document.getElementById("ingredients").value;

    if (!ingredients) {
        alert("Please enter ingredients first!");
        return;
    }

    document.getElementById("result").innerHTML = "<p>Loading recipe...</p>";

    try {
        const res = await fetch(
            `https://ai-project1-1iws.onrender.com/recommend-text-simple?ingredients=${encodeURIComponent(ingredients)}`
        );

        if (!res.ok) {
            throw new Error("API request failed");
        }

        const data = await res.text();

        document.getElementById("result").innerHTML = `
            <div class="card">
                <div class="title">🍽 Recommended Recipe</div>
                <pre>${data}</pre>
            </div>
        `;
    } catch (error) {
        document.getElementById("result").innerHTML = `
            <div class="card">
                <div class="title">❌ Error</div>
                <p>Could not fetch recipe. Please check your internet or backend.</p>
            </div>
        `;
        console.error(error);
    }
}
</script>

</body>
</html>
